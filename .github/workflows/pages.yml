name: Docs (GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install docs dependencies
        run: pip install -r site/requirements-docs.txt

      - name: Validate infographic assets
        run: |
          set -euo pipefail
          HERO="site/docs/assets/infographics/hero-ai-writing-whos-reviewing.png"
          PIPELINE="site/docs/assets/infographics/pipeline-5-stage-two-outputs.png"

          test -f "$HERO" || { echo "ERROR: Missing $HERO. Replace placeholder images before deploy."; exit 1; }
          test -f "$PIPELINE" || { echo "ERROR: Missing $PIPELINE. Replace placeholder images before deploy."; exit 1; }

          hero_size=$(wc -c < "$HERO")
          pipeline_size=$(wc -c < "$PIPELINE")

          [ "$hero_size" -ge 10240 ] || { echo "ERROR: $HERO is too small (${hero_size} bytes). Replace placeholder images before deploy."; exit 1; }
          [ "$pipeline_size" -ge 10240 ] || { echo "ERROR: $PIPELINE is too small (${pipeline_size} bytes). Replace placeholder images before deploy."; exit 1; }

          if cmp -s "$HERO" "$PIPELINE"; then
            echo "ERROR: Infographic files are byte-identical. Replace placeholder images before deploy."
            exit 1
          fi

      - name: Build MkDocs site
        working-directory: site
        run: mkdocs build --site-dir ../site_out

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site_out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

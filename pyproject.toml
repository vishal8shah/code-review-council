[project]
name = "code-review-council"
version = "0.3.0"
description = "Evidence-based multi-agent AI code review gate for AI-generated pull requests"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vishal Shah" },
]
keywords = [
    "ai-agents",
    "ai-generated-code",
    "ai-code-review",
    "audit",
    "ci",
    "claude-code",
    "code-review",
    "codex",
    "code-quality",
    "github-actions",
    "llm",
    "multi-agent",
    "pull-request",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.9.0",
    "litellm>=1.50.0",
    "ruff>=0.8.0",
    "unidiff>=0.7.0",
    "tiktoken>=0.7.0",
    "tomli>=2.0.0;python_version<'3.11'",
]

[project.scripts]
council = "council.cli:app"

[project.urls]
Homepage = "https://vishal8shah.github.io/code-review-council/"
Documentation = "https://vishal8shah.github.io/code-review-council/"
Repository = "https://github.com/vishal8shah/code-review-council"
Issues = "https://github.com/vishal8shah/code-review-council/issues"
Security = "https://github.com/vishal8shah/code-review-council/security/advisories/new"
Roadmap = "https://github.com/vishal8shah/code-review-council/blob/main/COMMERCIAL_READINESS.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["council"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
